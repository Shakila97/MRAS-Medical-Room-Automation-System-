services:
  # -----------------------------------------------------------------------
  # MongoDB 7.0
  # -----------------------------------------------------------------------
  db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: mras
      MONGO_INITDB_ROOT_PASSWORD: mras
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # FastAPI Backend
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://mras:mras@db:27017/mras_db?authSource=admin
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # React Frontend (dev server)
  # -----------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  mongodata:
